[project]
name = "sdlc-harness"
version = "0.2.0"
description = "Multi-agent SDLC harness with Docker sandbox, LangSmith tracing, and specialist subagents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned with an upper bound: deepagents ships breaking changes in MINOR
    # versions (0.6 -> 0.7 made StoreBackend's `namespace` a required kwarg),
    # so a bare ">=" floats straight into them. This repo already hit that —
    # uv.lock held the host at 0.6.3 while the Dockerfile, which installs from
    # pyproject alone and never copies the lock, resolved 0.7.8 at build time.
    # Same commit, two different libraries.
    "deepagents>=0.7.13,<0.8",
    "jinja2>=3.1",
    "tavily-python>=0.7.24",
    # Web search for the orchestrator — DuckDuckGo via langchain-community.
    # No API key required. langchain-community ships the BaseTool /
    # DuckDuckGoSearchResults wrapper; `ddgs` is the underlying HTTP
    # client (renamed from the older `duckduckgo-search` package). Either
    # package missing is handled gracefully in
    # WebSearchTool.build_web_search_tools() so the backend still boots.
    "langchain-community>=0.3.0",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=21.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6",
    "docker>=7.0",
    "langchain-openai>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-nvidia-ai-endpoints",
    "aiosqlite>=0.20",
    "langsmith>=0.2",
    "python-dotenv>=1.0",
    # Domain validators — optional at runtime; missing deps are handled
    # gracefully in _build_tools(), which warns and lets the agent run without
    # the gate rather than failing to boot.
    "pyyaml>=6.0",
    # MCP servers configured from the Settings panel (services/mcp.py).
  # Deliberately the deprecated adapter rather than `langchain[mcp]`:
  # `import langchain.mcp` fails on the pinned langchain 1.3.18 AND with the
  # latest `langchain[mcp]` extra (verified by import), while this package
  # imports cleanly against langchain-core 1.6.1. Revisit when langchain ships
  # the namespace and the deepagents pin allows the bump.
  "langchain-mcp-adapters>=0.3,<0.4",
    # OAuth persistence hooks are verified against this SDK minor version.
    "mcp>=1.30,<1.31",
  "openapi-spec-validator>=0.7",
    "jsonschema>=4.0",
    "gherkin-official>=29.0",
    # Binary document preview (docx → html, pdf → text/html, xlsx → html)
    "mammoth>=1.6",
    "pymupdf>=1.23",
    "xlsx2html>=0.6",
    # Markdown → PDF (download flow). Pure-Python, built on pymupdf.
    "markdown-pdf>=1.0",
    # Postgres persistence — conversations + messages (replaces frontend
    # localStorage). SQLAlchemy 2.0 async + asyncpg, schema managed by
    # Alembic. See backend/src/sdlc/db/.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Progress bars and rich terminal output for the evaluation CLI
    "rich>=13.0",
    # HTTP client for external service calls
    "httpx>=0.27",
]

[build-system]
# Setuptools 69+ supports `**/*` recursive globs in package-data, which
# we rely on below to ship Jinja templates, skill markdown, alembic
# configs alongside the .py files.
# Older setuptools silently dropped these and the runtime crashed with
# `TemplateNotFound: ingestion.j2` once installed from the wheel.
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Files declared here ride along inside the wheel. `subagents.py` resolves
# its prompts via `Path(__file__).parent / "prompts"`, the SkillsMiddleware
# loads `sdlc/skills/<diagram>/SKILL.md` by deterministic path, the
# MermaidSyntaxTool reads `sdlc/tools/db/mermaid_syntax.yaml`, alembic loads
# `sdlc/db/alembic.ini`, and so on — all of which break without the
# corresponding files shipped in the wheel.
sdlc = [
    "skills/**/*.md",
    "tools/db/*.yaml",
    "db/alembic.ini",
    "db/migrations/*.mako",
]
"sdlc.services" = ["prompts/*.j2"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
serve = "sdlc.api.app:main"
