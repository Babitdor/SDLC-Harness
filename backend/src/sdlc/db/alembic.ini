; Alembic config for the SDLC harness DB layer.
;
; The DATABASE_URL is sourced from the running process's environment via
; sdlc.db.engine._alembic_config(), which sets `sqlalchemy.url` at
; runtime. The placeholder below exists only so `alembic` CLI commands
; (e.g. `alembic -c .../alembic.ini revision`) work outside the app.
;
; To create a new revision manually:
;   cd backend
;   set DATABASE_URL=postgresql+asyncpg://harness:harness@localhost:5432/harness
;   alembic -c src/sdlc/db/alembic.ini revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg2://harness:harness@localhost:5432/harness

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
